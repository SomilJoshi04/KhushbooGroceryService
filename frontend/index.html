<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/websiteLogo.png" />
    <link rel="apple-touch-icon" href="/websiteLogo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Khushboo Grocery Service - Premium Stone-Ground Wheat Flour, Gram Flour, Pure Spices, Pulses, Pure Cow Ghee, and Daily Grocery Essentials delivered fresh across Indore." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>Khushboo Grocery Service | Pure & Fresh Daily Essentials — Indore</title>
    <style>
      /* Ultra-lightweight pre-hydration initial shell styles (0ms FCP) */
      .app-shell-root {
        min-height: 100vh;
        background-color: #FAF9F6;
        color: #252A26;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
      }
      .app-shell-header {
        background-color: #FFFFFF;
        border-bottom: 1px solid #E5E8E3;
        padding: 12px 16px;
        position: sticky;
        top: 0;
        z-index: 40;
      }
      .app-shell-header-inner {
        max-width: 1280px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .app-shell-brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .app-shell-logo {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background-color: #245C43;
        color: #FFFFFF;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 800;
        font-size: 13px;
        letter-spacing: -0.5px;
      }
      .app-shell-title {
        font-size: 16px;
        font-weight: 700;
        color: #245C43;
        line-height: 1.2;
      }
      .app-shell-sub {
        font-size: 11px;
        color: #71766F;
      }
      .app-shell-search {
        flex: 1;
        max-width: 440px;
        height: 38px;
        background-color: #F0F4EE;
        border: 1px solid #E5E8E3;
        border-radius: 12px;
        display: none;
      }
      @media (min-width: 640px) {
        .app-shell-search {
          display: block;
        }
      }
      .app-shell-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .app-shell-btn {
        height: 36px;
        padding: 0 14px;
        border-radius: 10px;
        background-color: #F0F4EE;
        border: 1px solid #E5E8E3;
        font-size: 12px;
        font-weight: 600;
        color: #245C43;
        display: flex;
        align-items: center;
      }
      .app-shell-hero {
        background: linear-gradient(180deg, #F0F4EE 0%, #FAF9F6 100%);
        border-bottom: 1px solid #E5E8E3;
        padding: 32px 16px;
      }
      .app-shell-hero-inner {
        max-width: 1280px;
        margin: 0 auto;
      }
      .app-shell-pill {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        background-color: rgba(36, 92, 67, 0.08);
        border: 1px solid rgba(36, 92, 67, 0.2);
        color: #245C43;
        font-size: 11px;
        font-weight: 700;
        margin-bottom: 12px;
      }
      .app-shell-headline {
        height: 36px;
        width: 320px;
        max-width: 80%;
        background-color: rgba(229, 232, 227, 0.7);
        border-radius: 8px;
        margin-bottom: 12px;
      }
      .app-shell-desc {
        height: 16px;
        width: 480px;
        max-width: 90%;
        background-color: rgba(229, 232, 227, 0.5);
        border-radius: 6px;
      }
    </style>
  </head>
  <body class="bg-[#FAF9F6] text-[#252A26] selection:bg-[#DCE8DC] selection:text-[#194632]">
    <div id="root">
      <!-- Lightweight, instantaneous visual shell (paints in < 50ms before JS bundle arrives) -->
      <div class="app-shell-root" aria-hidden="true">
        <header class="app-shell-header">
          <div class="app-shell-header-inner">
            <div class="app-shell-brand">
              <div class="app-shell-logo">KGS</div>
              <div>
                <div class="app-shell-title">Khushboo</div>
                <div class="app-shell-sub">Grocery Service • Indore</div>
              </div>
            </div>
            <div class="app-shell-search"></div>
            <div class="app-shell-actions">
              <div class="app-shell-btn">🛒 Bag</div>
            </div>
          </div>
        </header>

        <section class="app-shell-hero">
          <div class="app-shell-hero-inner">
            <span class="app-shell-pill">100% Pure &amp; Stone-Ground Groceries</span>
            <div class="app-shell-headline"></div>
            <div class="app-shell-desc"></div>
          </div>
        </section>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
